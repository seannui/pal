# Solid Queue recurring jobs for pal rhythms.
# Cron expressions in America/Denver (set via config.time_zone in application.rb).
# Minutes deliberately off :00/:30 to nudge this off the default fleet window.

production: &default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  daily_brief:
    class: DailyBriefJob
    schedule: "57 6 * * 1-5"

  weekly_wrap:
    class: WeeklyWrapJob
    schedule: "3 16 * * 5"

  monthly_review:
    class: MonthlyReviewJob
    # Fires every Monday 7:03; the job self-gates on "first Monday of the month".
    schedule: "3 7 * * 1"

development:
  <<: *default
